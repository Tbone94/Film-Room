name: Build Commanders Pulse

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 22 * * 0"
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Commanders Pulse scraper
        run: python3 scripts/scrape-commanders-reddit.py

      - name: Show pulse data summary
        run: |
          python3 - <<'PY'
          import json

          with open("data/reddit-pulse.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("posts_collected:", data.get("posts_collected"))
          print("updated_iso:", data.get("updated_iso"))
          print("last_attempted_iso:", data.get("last_attempted_iso"))
          print("pulse:", json.dumps(data.get("pulse", {}), indent=2))
          print("errors:", json.dumps(data.get("errors", {}), indent=2))
          print("source_status:", json.dumps(data.get("meta", {}).get("source_status", {}), indent=2)[:12000])
          PY

      - name: Commit updated pulse data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/reddit-pulse.json data/reddit-pulse-history.json

          if git diff --cached --quiet; then
            echo "No pulse data changes to commit."
          else
            git commit -m "Auto-refresh Commanders Pulse data"
            git push
          fi
